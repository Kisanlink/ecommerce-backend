<!doctype html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pay with Razorpay</title>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
            padding: 24px
        }

        button {
            padding: 10px 16px;
            font-size: 16px;
            cursor: pointer
        }
    </style>
</head>

<body>
    <h2>Razorpay Payment</h2>
    <p>Order: <strong id="orderId">order_RDsZIgWo24ESUz</strong></p>
    <p>Amount: <strong id="amount">130.93</strong> <span id="currency">INR</span></p>
    <button id="payBtn">Pay Now</button>
    <pre id="out" style="margin-top:16px;background:#f7f7f7;padding:12px;overflow:auto"></pre>
    <script>
        const out = document.getElementById('out');
		const options = {
			key: 'rzp_test_RD9Sm9rzmAeNcN',
			order_id: 'order_RDsZIgWo24ESUz',
				amount:  13093 ,
				currency: 'INR',
			handler: function (response){
				out.textContent = JSON.stringify(response, null, 2);
				alert('Payment completed. Copy these IDs and call your /payments/verify API.');
			},
			modal: { ondismiss: function(){ out.textContent = 'Checkout dismissed'; } },
			theme: { color: '#3399cc' }
		};
		document.getElementById('payBtn').onclick = function(){
			const rzp = new Razorpay(options);
			rzp.open();
		};
    </script>
</body>

</html>
