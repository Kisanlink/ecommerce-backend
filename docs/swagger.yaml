basePath: /api/v1
definitions:
  handlers.AddMultipleImagesRequest:
    properties:
      image_type:
        type: string
      image_urls:
        items:
          type: string
        type: array
      product_id:
        type: string
    required:
    - image_type
    - image_urls
    - product_id
    type: object
  handlers.CreateImageRequest:
    properties:
      alt_text:
        type: string
      caption:
        type: string
      image_type:
        type: string
      image_url:
        type: string
      product_id:
        type: string
    required:
    - image_type
    - image_url
    - product_id
    type: object
  handlers.CreateOrderRequest:
    properties:
      currency:
        description: Ignored (hardcoded to INR)
        type: string
      first_name:
        description: Required
        type: string
      last_name:
        type: string
      mobile:
        description: Required (primary)
        type: string
      mobile_secondary:
        type: string
      shipping_address:
        description: 'Optional: if providing new address'
        type: string
      shipping_address_id:
        description: 'Optional: if using saved addresses'
        type: string
      subtotal:
        type: number
    type: object
  handlers.CreateOrderResponse:
    properties:
      amount:
        type: number
      checkout_url:
        type: string
      currency:
        type: string
      description:
        type: string
      key_id:
        type: string
      notes:
        additionalProperties: true
        type: object
      order_id:
        type: string
    type: object
  handlers.ReorderImagesRequest:
    properties:
      image_orders:
        additionalProperties:
          type: integer
        type: object
    required:
    - image_orders
    type: object
  handlers.UpdateImageRequest:
    properties:
      alt_text:
        type: string
      caption:
        type: string
      image_type:
        type: string
      image_url:
        type: string
      is_active:
        type: boolean
      sort_order:
        type: integer
    type: object
  handlers.VerifyPaymentRequest:
    properties:
      razorpay_order_id:
        type: string
      razorpay_payment_id:
        type: string
      razorpay_signature:
        type: string
    required:
    - razorpay_order_id
    - razorpay_payment_id
    - razorpay_signature
    type: object
  handlers.VerifyPaymentResponse:
    properties:
      awb_number:
        type: string
      message:
        type: string
      order_id:
        type: string
      payment_id:
        type: string
      success:
        type: boolean
      tracking_url:
        type: string
    type: object
  models.CouponRuleType:
    enum:
    - percentage
    - fixed
    - free_shipping
    type: string
    x-enum-varnames:
    - CouponRuleTypePercentage
    - CouponRuleTypeFixed
    - CouponRuleTypeFreeShipping
  models.Recipe:
    type: object
  requests.AddFavoriteRequest:
    properties:
      product_id:
        type: string
    required:
    - product_id
    type: object
  requests.AddToCartRequest:
    properties:
      product_id:
        minLength: 1
        type: string
      quantity:
        maximum: 1000
        minimum: 1
        type: integer
      unit_price:
        description: Optional, will be fetched from product if not provided
        minimum: 0
        type: number
    required:
    - product_id
    - quantity
    type: object
  requests.ApplyCouponRequest:
    properties:
      coupon_code:
        maxLength: 50
        minLength: 1
        type: string
    required:
    - coupon_code
    type: object
  requests.ApplyCouponToUserRequest:
    properties:
      code:
        type: string
      user_id:
        type: string
    required:
    - code
    - user_id
    type: object
  requests.CreateCouponRequest:
    properties:
      categories:
        items:
          type: string
        type: array
      code:
        type: string
      count:
        type: integer
      created_by:
        type: string
      description:
        type: string
      first_time_only:
        type: boolean
      max_discount:
        type: number
      min_amount:
        type: number
      products:
        items:
          type: string
        type: array
      rule_type:
        $ref: '#/definitions/models.CouponRuleType'
      user_limit:
        type: integer
      valid_from:
        type: string
      valid_until:
        type: string
      value:
        type: number
    required:
    - code
    - count
    - created_by
    - description
    - rule_type
    - value
    type: object
  requests.CreateCouponRuleRequest:
    properties:
      categories:
        items:
          type: string
        type: array
      coupon_id:
        type: string
      discount_value:
        type: number
      first_time_only:
        type: boolean
      max_discount:
        type: number
      min_amount:
        type: number
      products:
        items:
          type: string
        type: array
      rule_type:
        $ref: '#/definitions/models.CouponRuleType'
      user_limit:
        type: integer
      valid_from:
        type: string
      valid_until:
        type: string
    required:
    - coupon_id
    - discount_value
    - rule_type
    type: object
  requests.CreateInventoryRequest:
    type: object
  requests.CreateProductRequest:
    type: object
  requests.CreateReviewRequest:
    properties:
      comment:
        maxLength: 1000
        minLength: 10
        type: string
      product_id:
        type: string
      rating:
        maximum: 5
        minimum: 1
        type: integer
      title:
        maxLength: 100
        minLength: 5
        type: string
    required:
    - comment
    - product_id
    - rating
    - title
    type: object
  requests.DecrementCartItemRequest:
    properties:
      amount:
        description: Default to 1 if not provided or 0
        maximum: 100
        minimum: 1
        type: integer
    type: object
  requests.DelhiveryPickupLocation:
    properties:
      name:
        type: string
    required:
    - name
    type: object
  requests.DelhiveryShipmentDetail:
    properties:
      add:
        type: string
      address_type:
        description: home/office
        type: string
      city:
        type: string
      cod_amount:
        type: string
      country:
        type: string
      hsn_code:
        type: string
      name:
        type: string
      order:
        description: Order ID
        type: string
      order_date:
        type: string
      payment_mode:
        description: Prepaid/COD
        type: string
      phone:
        type: string
      pin:
        type: string
      products_desc:
        type: string
      quantity:
        type: string
      return_add:
        type: string
      return_city:
        type: string
      return_country:
        type: string
      return_name:
        type: string
      return_phone:
        type: string
      return_pin:
        type: string
      return_state:
        type: string
      seller_add:
        type: string
      seller_inv:
        type: string
      seller_name:
        type: string
      shipment_height:
        type: string
      shipment_width:
        type: string
      shipping_mode:
        description: Surface/Express
        type: string
      state:
        type: string
      total_amount:
        type: string
      waybill:
        description: Leave empty for auto-generation
        type: string
      weight:
        type: string
    required:
    - add
    - city
    - country
    - name
    - order
    - payment_mode
    - phone
    - pin
    - products_desc
    - quantity
    - return_add
    - return_city
    - return_country
    - return_name
    - return_phone
    - return_pin
    - return_state
    - shipping_mode
    - state
    - total_amount
    - weight
    type: object
  requests.DelhiveryShipmentRequest:
    properties:
      pickup_location:
        $ref: '#/definitions/requests.DelhiveryPickupLocation'
      shipments:
        items:
          $ref: '#/definitions/requests.DelhiveryShipmentDetail'
        type: array
    type: object
  requests.EstimateShippingRequest:
    properties:
      address:
        properties:
          city:
            maxLength: 100
            minLength: 1
            type: string
          country:
            maxLength: 100
            minLength: 1
            type: string
          postal_code:
            maxLength: 20
            minLength: 1
            type: string
          state:
            maxLength: 100
            minLength: 1
            type: string
          street:
            maxLength: 200
            minLength: 1
            type: string
        required:
        - city
        - country
        - postal_code
        - state
        - street
        type: object
      phone:
        type: string
      shipping_method:
        enum:
        - standard
        - express
        - overnight
        type: string
    required:
    - address
    type: object
  requests.IncrementCartItemRequest:
    properties:
      amount:
        description: Default to 1 if not provided or 0
        maximum: 100
        minimum: 1
        type: integer
    type: object
  requests.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  requests.ReleaseStockRequest:
    properties:
      product_id:
        type: string
      quantity:
        minimum: 1
        type: integer
    required:
    - product_id
    type: object
  requests.RemoveFavoriteRequest:
    properties:
      product_id:
        type: string
    required:
    - product_id
    type: object
  requests.ReserveStockRequest:
    properties:
      product_id:
        type: string
      quantity:
        minimum: 1
        type: integer
    required:
    - product_id
    type: object
  requests.RestockRequest:
    type: object
  requests.SellStockRequest:
    type: object
  requests.SignupRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        minLength: 6
        type: string
    required:
    - email
    - name
    - password
    type: object
  requests.UpdateCartItemRequest:
    properties:
      quantity:
        description: 0 quantity means remove item
        maximum: 1000
        minimum: 0
        type: integer
    required:
    - quantity
    type: object
  requests.UpdateCouponRequest:
    properties:
      categories:
        items:
          type: string
        type: array
      count:
        type: integer
      description:
        type: string
      first_time_only:
        type: boolean
      id:
        type: string
      is_active:
        type: boolean
      max_discount:
        type: number
      min_amount:
        type: number
      products:
        items:
          type: string
        type: array
      rule_type:
        $ref: '#/definitions/models.CouponRuleType'
      user_limit:
        type: integer
      valid_from:
        type: string
      valid_until:
        type: string
      value:
        type: number
    type: object
  requests.UpdateCouponRuleRequest:
    properties:
      categories:
        items:
          type: string
        type: array
      discount_value:
        type: number
      first_time_only:
        type: boolean
      id:
        type: string
      max_discount:
        type: number
      min_amount:
        type: number
      products:
        items:
          type: string
        type: array
      rule_type:
        $ref: '#/definitions/models.CouponRuleType'
      user_limit:
        type: integer
      valid_from:
        type: string
      valid_until:
        type: string
    type: object
  requests.UpdateInventoryRequest:
    type: object
  requests.UpdateProfileRequest:
    properties:
      address_line1:
        description: Address fields
        maxLength: 255
        type: string
      address_line2:
        maxLength: 255
        type: string
      city:
        maxLength: 100
        type: string
      country:
        maxLength: 100
        type: string
      date_of_birth:
        type: string
      first_name:
        maxLength: 50
        minLength: 2
        type: string
      gender:
        enum:
        - male
        - female
        - other
        type: string
      last_name:
        maxLength: 50
        minLength: 2
        type: string
      newsletter_subscribed:
        type: boolean
      phone:
        type: string
      pincode:
        maxLength: 20
        type: string
      preferred_language:
        description: Preferences
        maxLength: 10
        type: string
      profile_picture_url:
        description: Profile picture
        type: string
      state:
        maxLength: 100
        type: string
    type: object
  requests.UpdateReviewRequest:
    properties:
      comment:
        maxLength: 1000
        minLength: 10
        type: string
      rating:
        maximum: 5
        minimum: 1
        type: integer
      title:
        maxLength: 100
        minLength: 5
        type: string
    required:
    - comment
    - rating
    - title
    type: object
  requests.UpdateStockRequest:
    type: object
  requests.ValidateCouponRequest:
    properties:
      cart_total:
        minimum: 0
        type: number
      code:
        type: string
      user_id:
        type: string
    required:
    - cart_total
    - code
    - user_id
    type: object
  requests.VerifyTokenRequest:
    properties:
      id_token:
        type: string
    required:
    - id_token
    type: object
  responses.InventoryResponse:
    properties:
      available_stock:
        type: integer
      created_at:
        type: string
      current_stock:
        type: integer
      id:
        type: string
      is_low_stock:
        type: boolean
      is_out_of_stock:
        type: boolean
      last_restocked_at:
        type: string
      last_sold_at:
        type: string
      max_stock_level:
        type: integer
      min_stock_level:
        type: integer
      needs_reorder:
        type: boolean
      product_id:
        type: string
      reorder_point:
        type: integer
      reserved_stock:
        type: integer
      stock_status:
        type: string
      updated_at:
        type: string
      updated_by:
        type: string
    type: object
  responses.ItemsNeedingReorderResponse:
    properties:
      count:
        type: integer
      items:
        items:
          $ref: '#/definitions/responses.InventoryResponse'
        type: array
      message:
        type: string
    type: object
  responses.LowStockItemsResponse:
    properties:
      count:
        type: integer
      items:
        items:
          $ref: '#/definitions/responses.InventoryResponse'
        type: array
      message:
        type: string
    type: object
  responses.OutOfStockItemsResponse:
    properties:
      count:
        type: integer
      items:
        items:
          $ref: '#/definitions/responses.InventoryResponse'
        type: array
      message:
        type: string
    type: object
  responses.PaginatedReviewsResponse:
    properties:
      has_next:
        type: boolean
      has_previous:
        type: boolean
      limit:
        type: integer
      page:
        type: integer
      reviews:
        items:
          $ref: '#/definitions/responses.ReviewResponse'
        type: array
      total_count:
        type: integer
      total_pages:
        type: integer
    type: object
  responses.ReviewActionResponse:
    properties:
      is_user_liked:
        type: boolean
      likes_count:
        type: integer
      message:
        type: string
      review_id:
        type: string
      success:
        type: boolean
    type: object
  responses.ReviewResponse:
    properties:
      can_delete:
        description: Whether the requesting user can delete this review
        type: boolean
      can_edit:
        description: Whether the requesting user can edit this review
        type: boolean
      comment:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      is_owner:
        description: Whether the requesting user is the review owner
        type: boolean
      is_user_liked:
        description: Whether the requesting user liked this review
        type: boolean
      is_verified:
        description: Whether the reviewer purchased the product
        type: boolean
      likes_count:
        type: integer
      product_id:
        type: string
      rating:
        type: integer
      review_date:
        type: string
      time_ago:
        description: Human readable time difference
        type: string
      title:
        type: string
      updated_date:
        type: string
      user_email:
        type: string
      user_id:
        type: string
      user_name:
        type: string
    type: object
  responses.ReviewStatsResponse:
    properties:
      average_rating:
        type: number
      product_id:
        type: string
      rating_breakdown:
        additionalProperties:
          type: integer
        description: '"1": count, "2": count, etc.'
        type: object
      recent_reviews:
        items:
          $ref: '#/definitions/responses.ReviewResponse'
        type: array
      top_reviews:
        description: Most liked reviews
        items:
          $ref: '#/definitions/responses.ReviewResponse'
        type: array
      total_reviews:
        type: integer
      unverified_reviews:
        type: integer
      verified_reviews:
        type: integer
    type: object
  responses.StockReleaseResponse:
    properties:
      available_stock:
        type: integer
      message:
        type: string
      product_id:
        type: string
      released_amount:
        type: integer
    type: object
  responses.StockReserveResponse:
    properties:
      available_stock:
        type: integer
      message:
        type: string
      product_id:
        type: string
      reserved_amount:
        type: integer
    type: object
  responses.StockRestockResponse:
    properties:
      message:
        type: string
      new_stock:
        type: integer
      product_id:
        type: string
      restocked_amount:
        type: integer
      stock_status:
        type: string
    type: object
  responses.StockSellResponse:
    properties:
      message:
        type: string
      product_id:
        type: string
      remaining_stock:
        type: integer
      sold_amount:
        type: integer
      stock_status:
        type: string
    type: object
  responses.StockUpdateResponse:
    properties:
      message:
        type: string
      new_stock:
        type: integer
      previous_stock:
        type: integer
      product_id:
        type: string
      stock_status:
        type: string
    type: object
  services.RazorpayPayment:
    properties:
      amount:
        type: integer
      amount_refunded:
        type: integer
      bank:
        type: string
      captured:
        type: boolean
      card_id:
        type: string
      contact:
        type: string
      created_at:
        type: integer
      currency:
        type: string
      description:
        type: string
      email:
        type: string
      entity:
        type: string
      error_code:
        type: string
      error_description:
        type: string
      fee:
        type: integer
      id:
        type: string
      international:
        type: boolean
      invoice_id:
        type: string
      method:
        type: string
      notes:
        additionalProperties: true
        type: object
      order_id:
        type: string
      refund_status:
        type: string
      status:
        type: string
      tax:
        type: integer
      vpa:
        type: string
      wallet:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: support@kisanlink.com
    name: API Support
    url: http://www.kisanlink.com/support
  description: A comprehensive ecommerce backend API with authentication, product
    management, cart, orders, and payment integration.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Ecommerce Backend API
  version: 1.0.0
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Login with email and password to get Firebase authentication tokens
      parameters:
      - description: User login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/requests.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Login successful
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request format
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Invalid credentials
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      summary: Authenticate user
      tags:
      - Authentication
  /auth/profile:
    get:
      consumes:
      - application/json
      description: Get the current authenticated user's profile information
      produces:
      - application/json
      responses:
        "200":
          description: User profile retrieved successfully
          schema:
            additionalProperties: true
            type: object
        "401":
          description: User not authenticated
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - FirebaseAuth: []
      summary: Get user profile
      tags:
      - Authentication
  /auth/refresh-token:
    post:
      consumes:
      - application/json
      description: Refresh a Firebase refresh token to get a new ID token
      parameters:
      - description: Refresh token
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Token refreshed successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request format
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Invalid or expired refresh token
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      summary: Refresh authentication token
      tags:
      - Authentication
  /auth/signup:
    post:
      consumes:
      - application/json
      description: Register a new user with email and password, creating accounts
        in both local database and Firebase
      parameters:
      - description: User signup information
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/requests.SignupRequest'
      produces:
      - application/json
      responses:
        "201":
          description: User created successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request or user already exists
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      summary: Create a new user account
      tags:
      - Authentication
  /auth/verify-token:
    post:
      consumes:
      - application/json
      description: Verify the validity of a Firebase ID token and return user information
      parameters:
      - description: Firebase ID token to verify
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/requests.VerifyTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Token verified successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request format
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Invalid or expired token
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      summary: Verify Firebase ID token
      tags:
      - Authentication
  /cart:
    get:
      consumes:
      - application/json
      description: Get the current user's shopping cart with all items
      produces:
      - application/json
      responses:
        "200":
          description: Cart retrieved successfully
          schema:
            additionalProperties: true
            type: object
        "401":
          description: User not authenticated
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - FirebaseAuth: []
      summary: Get user's cart
      tags:
      - Cart
  /cart/admin/cleanup-duplicates:
    post:
      produces:
      - application/json
      responses: {}
      security:
      - FirebaseAuth: []
      summary: 'Admin: cleanup duplicate carts'
      tags:
      - Admin - Cart
  /cart/checkout/apply-coupon:
    post:
      consumes:
      - application/json
      parameters:
      - description: Coupon request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/requests.ApplyCouponRequest'
      produces:
      - application/json
      responses:
