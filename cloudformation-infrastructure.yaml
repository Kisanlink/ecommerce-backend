AWSTemplateFormatVersion: '2010-09-09'
Description: 'E-commerce Backend Infrastructure - ECS, RDS, ElastiCache, ALB, ECR'

Parameters:
  Environment:
    Type: String
    Default: production
    AllowedValues: [development, staging, production]
    Description: Environment name

  VpcCIDR:
    Type: String
    Default: 10.0.0.0/16
    Description: CIDR block for VPC

  PublicSubnet1CIDR:
    Type: String
    Default: 10.0.1.0/24
    Description: CIDR block for public subnet 1

  PublicSubnet2CIDR:
    Type: String
    Default: 10.0.2.0/24
    Description: CIDR block for public subnet 2

  PrivateSubnet1CIDR:
    Type: String
    Default: 10.0.3.0/24
    Description: CIDR block for private subnet 1

  PrivateSubnet2CIDR:
    Type: String
    Default: 10.0.4.0/24
    Description: CIDR block for private subnet 2

  DatabaseName:
    Type: String
    Default: ecommerce_db
    Description: PostgreSQL database name

  DatabaseUsername:
    Type: String
    Default: dbadmin
    Description: PostgreSQL master username

  DatabasePassword:
    Type: String
    NoEcho: true
    Description: Password for RDS database

  RedisPassword:
    Type: String
    Default: ''
    NoEcho: true
    Description: Password for ElastiCache Redis (leave empty to disable auth)

  # Application Configuration Parameters
  ContainerImage:
    Type: String
    Description: ECR Docker image URI (e.g., 123456789012.dkr.ecr.ap-south-1.amazonaws.com/ecommerce-backend:latest)

  DesiredCount:
    Type: Number
    Default: '1'
    MinValue: '1'
    MaxValue: '10'
    Description: Number of ECS tasks to run

  ContainerCpu:
    Type: String
    Default: '512'
    AllowedValues:
      - '256'
      - '512'
      - '1024'
      - '2048'
      - '4096'
    Description: CPU units for the container (256 = 0.25 vCPU)

  ContainerMemory:
    Type: String
    Default: '1024'
    AllowedValues:
      - '512'
      - '1024'
      - '2048'
      - '4096'
      - '8192'
      - '16384'
    Description: Memory in MB for the container

  # Secret Parameters
  JWTSecret:
    Type: String
    NoEcho: true
    MinLength: '32'
    Description: JWT secret key (minimum 32 characters)

  FirebaseWebAPIKey:
    Type: String
    NoEcho: true
    Description: Firebase Web API Key for REST API operations

  FirebaseServiceAccountJSON:
    Type: String
    NoEcho: true
    Description: Firebase Service Account JSON (entire contents of firebase_service_account.json file)

  AWSAccessKeyID:
    Type: String
    NoEcho: true
    Description: AWS Access Key ID for application (for S3, DynamoDB)

  AWSSecretAccessKey:
    Type: String
    NoEcho: true
    Description: AWS Secret Access Key for application

  RazorpayKeyID:
    Type: String
    NoEcho: true
    Description: Razorpay Key ID

  RazorpayKeySecret:
    Type: String
    NoEcho: true
    Description: Razorpay Key Secret

  RazorpayWebhookSecret:
    Type: String
    NoEcho: true
    Description: Razorpay Webhook Secret

  RazorpayAccountID:
    Type: String
    Description: Razorpay Account ID

  DelhiveryAPIToken:
    Type: String
    NoEcho: true
    Description: Delhivery API Token

  WhatsAppAccessToken:
    Type: String
    NoEcho: true
    Description: WhatsApp Access Token

  # WhatsApp Configuration
  WhatsAppPhoneNumberID:
    Type: String
    Description: WhatsApp Phone Number ID

  WhatsAppBusinessAccountID:
    Type: String
    Description: WhatsApp Business Account ID

  WhatsAppWebhookToken:
    Type: String
    Description: WhatsApp Webhook Verification Token

  # Delhivery Configuration
  DelhiveryOriginPincode:
    Type: String
    Description: Delhivery origin pincode

  DelhiveryOriginCity:
    Type: String
    Description: Delhivery origin city

  DelhiveryOriginState:
    Type: String
    Description: Delhivery origin state

  DelhiveryOriginAddress:
    Type: String
    Description: Delhivery origin full address

  DelhiveryOriginPhone:
    Type: String
    Description: Delhivery origin phone number

  DelhiveryWarehouseName:
    Type: String
    Description: Delhivery warehouse name

Conditions:
  IsProduction: !Equals
    - !Ref Environment
    - production

Resources:
  # VPC and Networking
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCIDR
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub '${Environment}-ecommerce-vpc'

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${Environment}-ecommerce-igw'

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref InternetGateway
      VpcId: !Ref VPC

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: !Ref PublicSubnet1CIDR
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${Environment}-ecommerce-public-subnet-1'

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: !Ref PublicSubnet2CIDR
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${Environment}-ecommerce-public-subnet-2'

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: !Ref PrivateSubnet1CIDR
      Tags:
        - Key: Name
          Value: !Sub '${Environment}-ecommerce-private-subnet-1'

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: !Ref PrivateSubnet2CIDR
      Tags:
        - Key: Name
          Value: !Sub '${Environment}-ecommerce-private-subnet-2'

  NatGateway1EIP:
    Type: AWS::EC2::EIP
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc

  NatGateway2EIP:
    Type: AWS::EC2::EIP
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc

  NatGateway1:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatGateway1EIP.AllocationId
      SubnetId: !Ref PublicSubnet1

  NatGateway2:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatGateway2EIP.AllocationId
      SubnetId: !Ref PublicSubnet2

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub '${Environment}-ecommerce-public-rt'

  DefaultPublicRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet1

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet2

  PrivateRouteTable1:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub '${Environment}-ecommerce-private-rt-1'

  DefaultPrivateRoute1:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable1
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway1

  PrivateSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTable1
      SubnetId: !Ref PrivateSubnet1

  PrivateRouteTable2:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub '${Environment}-ecommerce-private-rt-2'

  DefaultPrivateRoute2:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable2
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway2

  PrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTable2
      SubnetId: !Ref PrivateSubnet2

  # Security Groups
  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub '${Environment}-ecommerce-alb-sg'
      GroupDescription: Security group for Application Load Balancer
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub '${Environment}-ecommerce-alb-sg'

  ECSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub '${Environment}-ecommerce-ecs-sg'
      GroupDescription: Security group for ECS tasks
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref ALBSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
          Description: Allow all outbound traffic
      Tags:
        - Key: Name
          Value: !Sub '${Environment}-ecommerce-ecs-sg'

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub '${Environment}-ecommerce-db-sg'
      GroupDescription: Security group for RDS database
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref ECSSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub '${Environment}-ecommerce-db-sg'

  RedisSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub '${Environment}-ecommerce-redis-sg'
      GroupDescription: Security group for ElastiCache Redis
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 6379
          ToPort: 6379
          SourceSecurityGroupId: !Ref ECSSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub '${Environment}-ecommerce-redis-sg'

  # RDS Database
  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnet group for RDS database
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      Tags:
        - Key: Name
          Value: !Sub '${Environment}-ecommerce-db-subnet-group'

  Database:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: !Sub '${Environment}-ecommerce-db'
      DBName: !Ref DatabaseName
      DBInstanceClass: db.t3.micro
      Engine: postgres
      EngineVersion: '15.4'
      MasterUsername: !Ref DatabaseUsername
      MasterUserPassword: !Ref DatabasePassword
      AllocatedStorage: '20'
      StorageType: gp2
      VPCSecurityGroups:
        - !Ref DatabaseSecurityGroup
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      BackupRetentionPeriod: 7
      MultiAZ: false
      PubliclyAccessible: false
      StorageEncrypted: true
      Tags:
        - Key: Name
          Value: !Sub '${Environment}-ecommerce-db'

  # ElastiCache Redis
  RedisSubnetGroup:
    Type: AWS::ElastiCache::SubnetGroup
    Properties:
      Description: Subnet group for Redis cluster
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2

  RedisCluster:
    Type: AWS::ElastiCache::ReplicationGroup
    Properties:
      ReplicationGroupId: !Sub '${Environment}-ecommerce-redis'
      ReplicationGroupDescription: Redis cluster for ecommerce backend
      CacheNodeType: cache.t3.micro
      Port: 6379
      NumCacheClusters: 1
      Engine: redis
      EngineVersion: '7.0'
      CacheSubnetGroupName: !Ref RedisSubnetGroup
      SecurityGroupIds:
        - !Ref RedisSecurityGroup
      AtRestEncryptionEnabled: false
      TransitEncryptionEnabled: false
      Tags:
        - Key: Name
          Value: !Sub '${Environment}-ecommerce-redis'

  # ECR Repository
  ECRRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: ecommerce-backend
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep last 10 images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 10
                },
                "action": {
                  "type": "expire"
                }
              }
            ]
          }

  # Application Load Balancer
  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub '${Environment}-ecommerce-alb'
      Scheme: internet-facing
      Type: application
      Subnets:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
      SecurityGroups:
        - !Ref ALBSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub '${Environment}-ecommerce-alb'

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${Environment}-ecommerce-tg'
      Port: 8080
      Protocol: HTTP
      VpcId: !Ref VPC
      TargetType: ip
      HealthCheckPath: /health
      HealthCheckProtocol: HTTP
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Tags:
        - Key: Name
          Value: !Sub '${Environment}-ecommerce-tg'

  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP

  # ECS Cluster
  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub '${Environment}-ecommerce-cluster'
      CapacityProviders:
        - FARGATE
        - FARGATE_SPOT
      DefaultCapacityProviderStrategy:
        - CapacityProvider: FARGATE
          Weight: 1
      ClusterSettings:
        - Name: containerInsights
          Value: enabled
      Tags:
        - Key: Name
          Value: !Sub '${Environment}-ecommerce-cluster'

  # CloudWatch Log Group
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/ecommerce-backend
      RetentionInDays: 30

  # IAM Roles
  ECSTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Environment}-ecsTaskExecutionRole'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: SecretsManagerAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - kms:Decrypt
                Resource:
                  - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${Environment}/ecommerce/*'

  ECSTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Environment}-ecsTaskRole'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: S3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !Sub 'arn:aws:s3:::${S3Bucket}'
                  - !Sub 'arn:aws:s3:::${S3Bucket}/*'
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:BatchGetItem
                  - dynamodb:BatchWriteItem
                Resource:
                  - !GetAtt RecipesTable.Arn
                  - !GetAtt ProductReviewsTable.Arn
                  - !Sub '${RecipesTable.Arn}/index/*'
                  - !Sub '${ProductReviewsTable.Arn}/index/*'

  # S3 Bucket for application data
  S3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${Environment}-ecommerce-backend-${AWS::AccountId}'
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - '*'
            AllowedMethods:
              - GET
              - PUT
              - POST
              - DELETE
              - HEAD
            AllowedOrigins:
              - '*'
            ExposedHeaders:
              - ETag
            MaxAge: 3000
      LifecycleConfiguration:
        Rules:
          - Id: DeleteIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - Key: Name
          Value: !Sub '${Environment}-ecommerce-backend-bucket'

  # S3 Bucket Policy for public read access to images
  S3BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref S3Bucket
      PolicyDocument:
        Statement:
          - Sid: PublicReadGetObject
            Effect: Allow
            Principal: '*'
            Action:
              - s3:GetObject
            Resource: !Sub '${S3Bucket.Arn}/*'

  # DynamoDB Tables
  RecipesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: recipes
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: category
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: category-index
          KeySchema:
            - AttributeName: category
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Name
          Value: !Sub '${Environment}-recipes-table'

  ProductReviewsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: product_reviews
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: product_id
          AttributeType: S
        - AttributeName: user_id
          AttributeType: S
      KeySchema:
        - AttributeName: product_id
          KeyType: HASH
        - AttributeName: user_id
          KeyType: RANGE
      Tags:
        - Key: Name
          Value: !Sub '${Environment}-product-reviews-table'

  # ===========================================
  # ECS Task Definition
  # ===========================================
  ECSTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    DependsOn:
      - Database
      - RedisCluster
      - S3Bucket
      - RecipesTable
      - ProductReviewsTable
      - DatabasePasswordSecret
      - JWTSecretResource
      - FirebaseAPIKeySecret
      - FirebaseServiceAccountSecret
      - AWSAccessKeySecret
      - AWSSecretKeySecret
      - RazorpayKeyIDSecret
      - RazorpayKeySecretResource
      - RazorpayWebhookSecretResource
      - DelhiveryTokenSecret
      - WhatsAppTokenSecret
    Properties:
      Family: !Sub '${Environment}-ecommerce-task'
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: !Ref ContainerCpu
      Memory: !Ref ContainerMemory
      ExecutionRoleArn: !GetAtt ECSTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt ECSTaskRole.Arn
      ContainerDefinitions:
        - Name: ecommerce-backend
          Image: !Ref ContainerImage
          Essential: true
          PortMappings:
            - ContainerPort: 8080
              Protocol: tcp
          Environment:
            # Application Configuration
            - Name: PORT
              Value: '8080'

            # PostgreSQL Configuration
            - Name: DB_POSTGRES_HOST
              Value: !GetAtt Database.Endpoint.Address
            - Name: DB_POSTGRES_PORT
              Value: '5432'
            - Name: DB_POSTGRES_USER
              Value: !Ref DatabaseUsername
            - Name: DB_POSTGRES_DBNAME
              Value: !Ref DatabaseName
            - Name: DB_POSTGRES_SSLMODE
              Value: 'disable'
            - Name: DB_POSTGRES_MAX_CONNS
              Value: '5'
            - Name: DB_POSTGRES_IDLE_CONNS
              Value: '2'

            # AWS Configuration
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: DYNAMODB_RECIPES_TABLE
              Value: 'recipes'

            # DynamoDB Configuration for Reviews
            - Name: DB_PRIMARY_BACKEND
              Value: 'gorm'
            - Name: DB_DYNAMO_REGION
              Value: !Ref AWS::Region
            - Name: DB_DYNAMO_TABLE
              Value: 'product_reviews'

            # S3 Configuration
            - Name: DB_S3_REGION
              Value: !Ref AWS::Region
            - Name: DB_S3_BUCKET
              Value: !Ref S3Bucket

            # Firebase Configuration
            - Name: FIREBASE_SERVICE_ACCOUNT_PATH
              Value: '/app/internal/config/firebase_service_account.json'

            # Redis Configuration
            - Name: REDIS_HOST
              Value: !GetAtt RedisCluster.PrimaryEndPoint.Address
            - Name: REDIS_PORT
              Value: '6379'
            - Name: REDIS_PASSWORD
              Value: ''
            - Name: REDIS_DB
              Value: '0'
            - Name: REDIS_MAX_IDLE
              Value: '10'
            - Name: REDIS_MAX_ACTIVE
              Value: '100'
            - Name: REDIS_TIMEOUT
              Value: '5'

            # Cart System Configuration
            - Name: CART_MAX_ITEMS
              Value: '50'
            - Name: CART_EXPIRY_HOURS
              Value: '72'

            # Delhivery Configuration
            - Name: DELHIVERY_PRODUCTION
              Value: 'true'
            - Name: DELHIVERY_BASE_URL
              Value: 'https://track.delhivery.com'
            - Name: DELHIVERY_ORIGIN_PINCODE
              Value: !Ref DelhiveryOriginPincode
            - Name: DELHIVERY_ORIGIN_CITY
              Value: !Ref DelhiveryOriginCity
            - Name: DELHIVERY_ORIGIN_STATE
              Value: !Ref DelhiveryOriginState
            - Name: DELHIVERY_ORIGIN_ADDRESS
              Value: !Ref DelhiveryOriginAddress
            - Name: DELHIVERY_ORIGIN_PHONE
              Value: !Ref DelhiveryOriginPhone
            - Name: DELHIVERY_WAREHOUSE_NAME
              Value: !Ref DelhiveryWarehouseName
            - Name: DELHIVERY_DEFAULT_WEIGHT
              Value: '300'

            # Razorpay Configuration
            - Name: RAZORPAY_ACCOUNT_ID
              Value: !Ref RazorpayAccountID
            - Name: RAZORPAY_LIVE
              Value: 'false'
            - Name: RAZORPAY_PRODUCTION
              Value: 'false'

            # Review System Configuration
            - Name: REVIEWS_ENABLED
              Value: 'true'
            - Name: REVIEWS_MAX_PER_PRODUCT_PER_USER
              Value: '1'
            - Name: REVIEWS_REQUIRE_PURCHASE_VERIFICATION
              Value: 'false'

            # WhatsApp Configuration
            - Name: WHATSAPP_ENABLED
              Value: 'true'
            - Name: WHATSAPP_PHONE_NUMBER_ID
              Value: !Ref WhatsAppPhoneNumberID
            - Name: WHATSAPP_BUSINESS_ACCOUNT_ID
              Value: !Ref WhatsAppBusinessAccountID
            - Name: WHATSAPP_WEBHOOK_TOKEN
              Value: !Ref WhatsAppWebhookToken
            - Name: WHATSAPP_API_BASE_URL
              Value: 'https://graph.facebook.com/v22.0'
            - Name: WHATSAPP_RETRY_ATTEMPTS
              Value: '3'
            - Name: WHATSAPP_RETRY_BACKOFF_MS
              Value: '1000'
            - Name: WHATSAPP_TIMEOUT_SECONDS
              Value: '30'
            - Name: WHATSAPP_MAX_MESSAGE_LENGTH
              Value: '4096'

            # Swagger/Documentation
            - Name: ENABLE_DOCS
              Value: 'true'
            - Name: SWAGGER_TITLE
              Value: !If [IsProduction, 'Ecommerce API - Production', 'Ecommerce API - Staging']
            - Name: SWAGGER_HOST
              Value: !GetAtt ApplicationLoadBalancer.DNSName

          Secrets:
            # Database Password
            - Name: DB_POSTGRES_PASSWORD
              ValueFrom: !Ref DatabasePasswordSecret

            # JWT Secret
            - Name: JWT_SECRET
              ValueFrom: !Ref JWTSecretResource

            # Firebase API Key
            - Name: FIREBASE_WEB_API_KEY
              ValueFrom: !Ref FirebaseAPIKeySecret

            # Firebase Service Account JSON
            - Name: FIREBASE_SERVICE_ACCOUNT_JSON_CONTENT
              ValueFrom: !Ref FirebaseServiceAccountSecret

            # AWS Credentials (for application use)
            - Name: AWS_ACCESS_KEY_ID
              ValueFrom: !Ref AWSAccessKeySecret
            - Name: AWS_SECRET_ACCESS_KEY
              ValueFrom: !Ref AWSSecretKeySecret

            # DynamoDB Credentials (same as AWS credentials)
            - Name: DB_DYNAMO_ACCESS_KEY_ID
              ValueFrom: !Ref AWSAccessKeySecret
            - Name: DB_DYNAMO_SECRET_ACCESS_KEY
              ValueFrom: !Ref AWSSecretKeySecret

            # Razorpay Credentials
            - Name: RAZORPAY_KEY_ID
              ValueFrom: !Ref RazorpayKeyIDSecret
            - Name: RAZORPAY_KEY_SECRET
              ValueFrom: !Ref RazorpayKeySecretResource
            - Name: RAZORPAY_WEBHOOK_SECRET
              ValueFrom: !Ref RazorpayWebhookSecretResource

            # Delhivery API Token
            - Name: DELHIVERY_API_TOKEN
              ValueFrom: !Ref DelhiveryTokenSecret

            # WhatsApp Access Token
            - Name: WHATSAPP_ACCESS_TOKEN
              ValueFrom: !Ref WhatsAppTokenSecret

          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

          HealthCheck:
            Command:
              - CMD-SHELL
              - wget --no-verbose --tries=1 --spider http://localhost:8080/health || exit 1
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 60

  # ===========================================
  # ECS Service
  # ===========================================
  ECSService:
    Type: AWS::ECS::Service
    DependsOn:
      - ALBListener
      - ECSTaskDefinition
    Properties:
      ServiceName: !Sub '${Environment}-ecommerce-service'
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref ECSTaskDefinition
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
            - !Ref PrivateSubnet1
            - !Ref PrivateSubnet2
          SecurityGroups:
            - !Ref ECSSecurityGroup
      LoadBalancers:
        - ContainerName: ecommerce-backend
          ContainerPort: 8080
          TargetGroupArn: !Ref TargetGroup
      HealthCheckGracePeriodSeconds: 120
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      Tags:
        - Key: Name
          Value: !Sub '${Environment}-ecommerce-service'

  # ===========================================
  # Auto Scaling
  # ===========================================
  ServiceScalingTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    DependsOn: ECSService
    Properties:
      MaxCapacity: 10
      MinCapacity: 1
      ResourceId: !Sub 'service/${ECSCluster}/${ECSService.Name}'
      RoleARN: !Sub 'arn:aws:iam::${AWS::AccountId}:role/aws-service-role/ecs.application-autoscaling.amazonaws.com/AWSServiceRoleForApplicationAutoScaling_ECSService'
      ScalableDimension: ecs:service:DesiredCount
      ServiceNamespace: ecs

  CPUScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub '${Environment}-ecommerce-cpu-scaling-policy'
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ServiceScalingTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization
        TargetValue: 70.0
        ScaleInCooldown: 300
        ScaleOutCooldown: 60

  MemoryScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub '${Environment}-ecommerce-memory-scaling-policy'
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ServiceScalingTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageMemoryUtilization
        TargetValue: 80.0
        ScaleInCooldown: 300
        ScaleOutCooldown: 60

  # ===========================================
  # CloudWatch Alarms
  # ===========================================
  HighCPUAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${Environment}-ecommerce-high-cpu'
      AlarmDescription: Alarm when CPU exceeds 80%
      MetricName: CPUUtilization
      Namespace: AWS/ECS
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: ServiceName
          Value: !GetAtt ECSService.Name
        - Name: ClusterName
          Value: !Ref ECSCluster
      TreatMissingData: notBreaching

  HighMemoryAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${Environment}-ecommerce-high-memory'
      AlarmDescription: Alarm when memory exceeds 85%
      MetricName: MemoryUtilization
      Namespace: AWS/ECS
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 85
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: ServiceName
          Value: !GetAtt ECSService.Name
        - Name: ClusterName
          Value: !Ref ECSCluster
      TreatMissingData: notBreaching

  UnhealthyTargetAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${Environment}-ecommerce-unhealthy-targets'
      AlarmDescription: Alarm when there are unhealthy targets in the load balancer
      MetricName: UnHealthyHostCount
      Namespace: AWS/ApplicationELB
      Statistic: Average
      Period: 60
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: TargetGroup
          Value: !GetAtt TargetGroup.TargetGroupFullName
        - Name: LoadBalancer
          Value: !GetAtt ApplicationLoadBalancer.LoadBalancerFullName
      TreatMissingData: notBreaching

  # ===========================================
  # Secrets Manager
  # ===========================================
  DatabasePasswordSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${Environment}/ecommerce/database-password'
      Description: RDS PostgreSQL Database Password
      SecretString: !Ref DatabasePassword

  JWTSecretResource:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${Environment}/ecommerce/jwt-secret'
      Description: JWT Secret Key for authentication
      SecretString: !Ref JWTSecret

  FirebaseAPIKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${Environment}/ecommerce/firebase-api-key'
      Description: Firebase Web API Key
      SecretString: !Ref FirebaseWebAPIKey

  FirebaseServiceAccountSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${Environment}/ecommerce/firebase-service-account'
      Description: Firebase Service Account JSON
      SecretString: !Ref FirebaseServiceAccountJSON

  AWSAccessKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${Environment}/ecommerce/aws-access-key-id'
      Description: AWS Access Key ID for application
      SecretString: !Ref AWSAccessKeyID

  AWSSecretKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${Environment}/ecommerce/aws-secret-access-key'
      Description: AWS Secret Access Key for application
      SecretString: !Ref AWSSecretAccessKey

  RazorpayKeyIDSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${Environment}/ecommerce/razorpay-key-id'
      Description: Razorpay Key ID
      SecretString: !Ref RazorpayKeyID

  RazorpayKeySecretResource:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${Environment}/ecommerce/razorpay-key-secret'
      Description: Razorpay Key Secret
      SecretString: !Ref RazorpayKeySecret

  RazorpayWebhookSecretResource:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${Environment}/ecommerce/razorpay-webhook-secret'
      Description: Razorpay Webhook Secret
      SecretString: !Ref RazorpayWebhookSecret

  DelhiveryTokenSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${Environment}/ecommerce/delhivery-api-token'
      Description: Delhivery API Token
      SecretString: !Ref DelhiveryAPIToken

  WhatsAppTokenSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${Environment}/ecommerce/whatsapp-access-token'
      Description: WhatsApp Access Token
      SecretString: !Ref WhatsAppAccessToken

Outputs:
  VPCId:
    Description: VPC ID
    Value: !Ref VPC
    Export:
      Name: !Sub '${Environment}-VPC-ID'

  PublicSubnet1Id:
    Description: Public Subnet 1 ID
    Value: !Ref PublicSubnet1
    Export:
      Name: !Sub '${Environment}-PublicSubnet1-ID'

  PublicSubnet2Id:
    Description: Public Subnet 2 ID
    Value: !Ref PublicSubnet2
    Export:
      Name: !Sub '${Environment}-PublicSubnet2-ID'

  PrivateSubnet1Id:
    Description: Private Subnet 1 ID
    Value: !Ref PrivateSubnet1
    Export:
      Name: !Sub '${Environment}-PrivateSubnet1-ID'

  PrivateSubnet2Id:
    Description: Private Subnet 2 ID
    Value: !Ref PrivateSubnet2
    Export:
      Name: !Sub '${Environment}-PrivateSubnet2-ID'

  ECSClusterName:
    Description: ECS Cluster Name
    Value: !Ref ECSCluster
    Export:
      Name: !Sub '${Environment}-ECS-Cluster-Name'

  ECRRepositoryURI:
    Description: ECR Repository URI
    Value: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ECRRepository}'
    Export:
      Name: !Sub '${Environment}-ECR-Repository-URI'

  ApplicationLoadBalancerDNS:
    Description: Application Load Balancer DNS
    Value: !GetAtt ApplicationLoadBalancer.DNSName
    Export:
      Name: !Sub '${Environment}-ALB-DNS'

  TargetGroupArn:
    Description: Target Group ARN
    Value: !Ref TargetGroup
    Export:
      Name: !Sub '${Environment}-TargetGroup-ARN'

  DatabaseEndpoint:
    Description: RDS Database Endpoint
    Value: !GetAtt Database.Endpoint.Address
    Export:
      Name: !Sub '${Environment}-Database-Endpoint'

  RedisEndpoint:
    Description: Redis Cluster Endpoint
    Value: !GetAtt RedisCluster.PrimaryEndPoint.Address
    Export:
      Name: !Sub '${Environment}-Redis-Endpoint'

  S3BucketName:
    Description: S3 Bucket Name
    Value: !Ref S3Bucket
    Export:
      Name: !Sub '${Environment}-S3-Bucket-Name'

  RecipesTableName:
    Description: DynamoDB Recipes Table Name
    Value: !Ref RecipesTable
    Export:
      Name: !Sub '${Environment}-Recipes-Table-Name'

  ProductReviewsTableName:
    Description: DynamoDB Product Reviews Table Name
    Value: !Ref ProductReviewsTable
    Export:
      Name: !Sub '${Environment}-Product-Reviews-Table-Name'

  ECSSecurityGroupId:
    Description: ECS Security Group ID
    Value: !Ref ECSSecurityGroup
    Export:
      Name: !Sub '${Environment}-ECS-SecurityGroup-ID'

  ALBSecurityGroupId:
    Description: ALB Security Group ID
    Value: !Ref ALBSecurityGroup
    Export:
      Name: !Sub '${Environment}-ALB-SecurityGroup-ID'

  ECSTaskExecutionRoleArn:
    Description: ECS Task Execution Role ARN
    Value: !GetAtt ECSTaskExecutionRole.Arn
    Export:
      Name: !Sub '${Environment}-ECS-TaskExecutionRole-ARN'

  ECSTaskRoleArn:
    Description: ECS Task Role ARN
    Value: !GetAtt ECSTaskRole.Arn
    Export:
      Name: !Sub '${Environment}-ECS-TaskRole-ARN'

  DatabaseName:
    Description: Database Name
    Value: !Ref DatabaseName
    Export:
      Name: !Sub '${Environment}-Database-Name'

  DatabaseUsername:
    Description: Database Username
    Value: !Ref DatabaseUsername
    Export:
      Name: !Sub '${Environment}-Database-Username'

  LogGroupName:
    Description: CloudWatch Log Group Name
    Value: !Ref LogGroup
    Export:
      Name: !Sub '${Environment}-LogGroup-Name'
